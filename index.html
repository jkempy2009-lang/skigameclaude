<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Avalanche Run</title>
<style>
  :root { --ink:#16324a; --accent:#e8412c; --card:rgba(250,253,255,.94); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#eef4fa; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); }
  canvas { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  #overlay { position:fixed; inset:0; display:flex; justify-content:center; padding:16px;
             background:rgba(190,214,236,.35); backdrop-filter:blur(3px); overflow:auto; }
  #overlay.hidden { display:none; }
  .card { margin:auto; background:var(--card); border-radius:18px; padding:26px 30px; max-width:560px; width:100%;
          box-shadow:0 18px 60px rgba(22,50,74,.28); text-align:center; }
  .card h1 { margin:0; font-size:clamp(30px,6vw,46px); letter-spacing:.04em; font-weight:900; font-style:italic; }
  .card h1 span { color:var(--accent); }
  .tag { margin:4px 0 16px; font-size:15px; opacity:.75; }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0; }
  .stat { background:#e6eff8; border-radius:10px; padding:8px 4px; }
  .stat b { display:block; font-size:22px; }
  .stat small { font-size:11px; letter-spacing:.08em; text-transform:uppercase; opacity:.65; }
  .keys { display:grid; grid-template-columns:auto 1fr; gap:6px 12px; text-align:left; font-size:14px; margin:14px 0; }
  .keys kbd { background:#e6eff8; border:1px solid #b9cde0; border-bottom-width:2px; border-radius:5px; padding:1px 6px; font:600 12px ui-monospace,monospace; margin-right:3px; }
  .tips { text-align:left; font-size:13.5px; line-height:1.5; margin:0 0 16px; padding-left:18px; opacity:.85; }
  .seg { display:inline-flex; margin:0 0 14px; border-radius:10px; overflow:hidden; border:2px solid #c3d4e4; }
  .seg button { font:700 14px system-ui,sans-serif; padding:8px 18px; border:0; background:#fff; color:var(--ink); cursor:pointer; }
  .seg button + button { border-left:2px solid #c3d4e4; }
  .seg button.on { background:var(--ink); color:#fff; }
  .badges { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:4px 0 8px; }
  .badge { background:#e6eff8; border-radius:999px; padding:5px 12px; font:700 13px system-ui,sans-serif; }
  .cn { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:4px; vertical-align:-1px;
        background:radial-gradient(circle at 35% 35%,#ffe27a,#f2b01e); box-shadow:0 0 0 1.5px #b9830a inset; }
  .badge.coin { color:#8a5a00; background:#fff3cf; }
  .xp { height:8px; background:#dbe6f1; border-radius:6px; overflow:hidden; margin:0 auto 10px; max-width:320px; }
  .xp > i { display:block; height:100%; background:linear-gradient(90deg,#3a9ad9,#6cc4ff); transition:width 1s cubic-bezier(.2,.8,.2,1); }
  .missions { text-align:left; margin:6px 0 12px; }
  .missions h3 { margin:0 0 4px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; opacity:.6; }
  .mission { display:flex; justify-content:space-between; gap:10px; background:#f0f6fb; border-radius:9px; padding:7px 10px; margin:4px 0; font-size:13.5px; }
  .mission b { color:#8a5a00; white-space:nowrap; }
  .row2 { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:2px; }
  button.secondary { position:relative; font:800 18px system-ui,sans-serif; letter-spacing:.06em; color:var(--ink); background:#e6eff8; border:0; border-radius:12px;
                     padding:13px 26px; cursor:pointer; box-shadow:0 4px 0 #b9cde0; }
  button.secondary:active { transform:translateY(2px); box-shadow:0 2px 0 #b9cde0; }
  button.secondary .dot { position:absolute; top:-5px; right:-5px; width:15px; height:15px; border-radius:50%; background:var(--accent); border:2px solid #fff; animation:pulse .7s infinite alternate; }
  .tally { text-align:left; margin:10px 0; }
  .tally .t { display:flex; justify-content:space-between; gap:10px; padding:5px 2px; border-bottom:1px dashed #cfdcea; font-size:14px; opacity:0; animation:pop .35s forwards; }
  .tally .t b { font-variant-numeric:tabular-nums; color:#8a5a00; }
  .tally .t.mission span { color:#1b7a38; font-weight:700; } .tally .t.level span { color:var(--accent); font-weight:800; } .tally .t.daily span { color:#3a7bd5; font-weight:700; }
  .tally .t.total { font-size:21px; font-weight:900; border-bottom:0; border-top:2px solid var(--ink); margin-top:4px; padding-top:8px; }
  @keyframes pop { from { opacity:0; transform:translateY(8px) scale(.97); } to { opacity:1; transform:none; } }
  @keyframes pulse { to { transform:scale(1.15); } }
  .lv { font-size:14px; margin-bottom:4px; } .lvlup { color:var(--accent); font-weight:900; letter-spacing:.08em; display:inline-block; animation:pulse .6s infinite alternate; }
  .nextgoal { background:#fff6dd; border-radius:10px; padding:9px 12px; margin:10px 0; font-size:13.5px; text-align:left; }
  .nextgoal.ready { background:#dff6e5; }
  .bar { height:7px; background:#ecdfb4; border-radius:5px; margin-top:6px; overflow:hidden; } .bar i { display:block; height:100%; background:#f2b01e; }
  .shop h2 { margin:14px 0 4px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; opacity:.6; text-align:left; }
  .shoprow { display:grid; grid-template-columns:34px 1fr auto; gap:2px 10px; align-items:center; text-align:left; padding:8px 4px; border-bottom:1px solid #dce7f1; }
  .shoprow.pop { animation:flash .8s; } @keyframes flash { from { background:#fff1b8; } to { background:transparent; } }
  .shoprow .ic { font-size:22px; text-align:center; } .shoprow .nm { font-weight:800; } .shoprow .fx { font-size:12.5px; opacity:.8; }
  .pips { display:inline-flex; gap:3px; margin-left:8px; vertical-align:middle; } .pips i { width:9px; height:9px; border-radius:50%; background:#cbd8e5; } .pips i.on { background:var(--accent); }
  button.buy { font:800 14px system-ui,sans-serif; padding:8px 12px; min-width:88px; border:0; border-radius:9px; background:#2fb457; color:#fff; cursor:pointer; box-shadow:0 3px 0 #1f8a40; }
  button.buy:disabled { background:#b9c7d4; box-shadow:0 3px 0 #98a8b8; cursor:not-allowed; }
  button.buy.max { background:#f2b01e; color:#3b2a00; box-shadow:0 3px 0 #b9830a; }
  .swatches { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:4px 0 6px; }
  .sw { width:92px; border:2px solid #c3d4e4; border-radius:12px; padding:8px 4px; background:#fff; cursor:pointer; font:700 12px system-ui,sans-serif; color:var(--ink); }
  .sw.eq { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset; } .sw.pop { animation:flash .8s; }
  .sw .dot { width:30px; height:30px; border-radius:50%; margin:0 auto 5px; border:2px solid rgba(0,0,0,.15); } .sw small { display:block; font-weight:600; opacity:.75; margin-top:2px; }
  details.how { text-align:left; margin:12px 0 4px; } details.how summary { cursor:pointer; font-weight:700; text-align:center; opacity:.75; font-size:14px; }
  .foot { position:sticky; bottom:0; margin:10px -30px -26px; padding:14px 30px 22px; border-radius:0 0 18px 18px; background:#f7fbfe; box-shadow:0 -1px 0 #dce7f1, 0 -12px 16px -8px rgba(22,50,74,.12); }
  .linkbtn { background:none; border:0; color:#6b7f92; font-size:12px; text-decoration:underline; cursor:pointer; margin-top:12px; }
  button.primary { font:800 18px system-ui,sans-serif; letter-spacing:.06em; color:#fff; background:var(--accent); border:0; border-radius:12px;
                   padding:13px 34px; cursor:pointer; box-shadow:0 4px 0 #a82a19; }
  button.primary:active { transform:translateY(2px); box-shadow:0 2px 0 #a82a19; }
  .best { margin-top:12px; font-size:13px; opacity:.7; }
  .newbest { color:var(--accent); font-weight:800; font-size:15px; letter-spacing:.06em; margin:2px 0 0; }

  .hudbtns { position:fixed; top:10px; right:10px; display:flex; gap:8px; z-index:5; }
  .hudbtns button { width:40px; height:40px; border-radius:50%; border:0; background:rgba(22,50,74,.55); color:#fff; font-size:17px; cursor:pointer; }

  .touch { position:fixed; left:0; right:0; bottom:0; height:46%; display:none; pointer-events:none; z-index:4; }
  .touch.on { display:block; }
  .touch .grp { position:absolute; bottom:calc(14px + env(safe-area-inset-bottom)); display:flex; gap:10px; pointer-events:auto; }
  .touch .l { left:14px; } .touch .r { right:14px; flex-direction:column; align-items:flex-end; }
  .touch button { width:84px; height:84px; border-radius:50%; border:2px solid rgba(255,255,255,.7); background:rgba(22,50,74,.35); color:#fff;
                  font:800 14px system-ui,sans-serif; touch-action:none; user-select:none; -webkit-user-select:none; }
  .touch button.sm { width:64px; height:64px; font-size:12px; }
  .touch button.down { background:rgba(232,65,44,.75); }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hudbtns">
  <button id="pauseBtn" title="Pause (P)" aria-label="Pause">❚❚</button>
  <button id="muteBtn" title="Mute (M)" aria-label="Mute">🔊</button>
</div>

<div class="touch" id="touch">
  <div class="grp l"><button data-k="left">◀</button><button data-k="right">▶</button></div>
  <div class="grp r"><button data-k="trick">HOP / TRICK</button><div style="display:flex;gap:10px"><button class="sm" data-k="brake">BRAKE</button><button class="sm" data-k="tuck">SPEED</button></div></div>
</div>

<div id="overlay"><div class="card" id="card"></div></div>

<script>
'use strict';
/* =====================================================================
   AVALANCHE RUN
   Ski down an endless mountain, dodge obstacles, hit gates, land tricks,
   and stay ahead of the avalanche that is chasing you.
   ===================================================================== */

/* ---------- utilities ---------- */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const wrapPi = a => { a %= TAU; if (a > Math.PI) a -= TAU; if (a < -Math.PI) a += TAU; return a; };
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const fmt = n => Math.floor(n).toLocaleString('en-US');

/* ---------- tuning ---------- */
const SR = 8;                 // skier collision radius
const VMAX = 520;             // straight-down speed (px/s)
const GRAV = 900;
const CH = 500;               // chunk height (world px)
const PX_PER_M = 10;
const BIOMES = [
  { name: 'Pine Forest',  from: 0,    ground: [245, 249, 253] },
  { name: 'Alpine Ridge', from: 1200, ground: [234, 240, 247] },
  { name: 'Glacier',      from: 3000, ground: [214, 233, 246] },
];
const biomeIndex = m => m >= 3000 ? 2 : m >= 1200 ? 1 : 0;
function groundRGB(m) {
  let c = BIOMES[0].ground;
  for (let i = 1; i < BIOMES.length; i++) {
    const t = clamp((m - (BIOMES[i].from - 150)) / 150, 0, 1), g = BIOMES[i].ground;
    c = [lerp(c[0], g[0], t), lerp(c[1], g[1], t), lerp(c[2], g[2], t)];
  }
  return c;
}
// third-person camera: sits BACK units behind the skier, looking down the slope
const BACK = 260, FAR = 3200, NEAR = 90, FOG0 = 1900;
let F = 480, HC = 156, HOR = 156;            // focal length, camera height, horizon screen-y
const LEVELS = {
  chill:  { label: 'Chill',  obs: -1.5, clear: 18, aval: -60, cross: 0.4, pay: 1 },
  normal: { label: 'Normal', obs: 0,    clear: 0,  aval: 0,   cross: 1,   pay: 1 },
  hard:   { label: 'Hard',   obs: 1,    clear: -8, aval: 30,  cross: 1.5, pay: 1.5 },
};
let level = 'normal';
try { const v = localStorage.getItem('avalancheRunLevel'); if (LEVELS[v]) level = v; } catch (e) { /* storage may be unavailable */ }
const LV = () => LEVELS[level];
const difficulty = y => clamp(y / PX_PER_M / 9000, 0, 1);
const laneHalf = y => lerp(340, 265, difficulty(y));
const laneCenter = y => { const k = Math.min(1, Math.max(0, y) / 1500); return k * (200 * Math.sin(y / 1300) + 120 * Math.sin(y / 520 + 1.3)); };

/* ---------- canvas ---------- */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 800, H = 600, scale = 1, cssU = 1;   // cssU: logical units per CSS pixel
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  scale = Math.min(canvas.height / 600, canvas.width / (innerWidth < innerHeight ? 560 : 800));
  W = canvas.width / scale; H = canvas.height / scale; cssU = dpr / scale;
  setupCamera();
}
function setupCamera() {
  F = 480 * clamp(W / 1066, 0.62, 1.2);
  HOR = H * 0.26;
  HC = (H * 0.74 - HOR) * BACK / F;          // puts the skier at 74% of screen height
}
addEventListener('resize', resize);
resize();

/* ---------- audio (all procedural, created on first interaction) ---------- */
const SFX = {
  ctx: null, muted: false,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const c = this.ctx = new AC();
      const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.nbuf = buf;
      const loop = (type, freq, q) => {
        const s = c.createBufferSource(); s.buffer = buf; s.loop = true;
        const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
        const g = c.createGain(); g.gain.value = 0;
        s.connect(f); f.connect(g); g.connect(c.destination); s.start();
        return { g, f };
      };
      this.wind = loop('bandpass', 500, 0.7);
      this.rumble = loop('lowpass', 110, 0.8);
    } catch (e) { this.ctx = null; }
  },
  ambient(speedNorm, danger) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime, m = this.muted ? 0 : 1;
    this.wind.g.gain.setTargetAtTime(m * speedNorm * 0.13, t, 0.12);
    this.wind.f.frequency.setTargetAtTime(300 + speedNorm * 1700, t, 0.12);
    this.rumble.g.gain.setTargetAtTime(m * danger * 0.5, t, 0.2);
  },
  silence() { if (this.ctx) this.ambient(0, 0); },
  tone(f, d, type = 'sine', vol = 0.15, slide = 0, delay = 0) {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.02);
  },
  noise(d, vol, freq, type = 'lowpass') {
    if (!this.ctx || this.muted) return;
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.nbuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t + d + 0.02);
  },
  gate(perfect) { this.tone(perfect ? 880 : 660, 0.18, 'triangle', 0.14); if (perfect) this.tone(1320, 0.22, 'triangle', 0.12, 0, 0.07); },
  crash() { this.noise(0.5, 0.5, 900); this.tone(110, 0.35, 'sawtooth', 0.18, -70); },
  jump() { this.noise(0.35, 0.18, 1800, 'bandpass'); this.tone(300, 0.3, 'sine', 0.08, 300); },
  land(good) { this.noise(0.22, 0.28, 500); if (good) { this.tone(523, 0.12, 'square', 0.07); this.tone(784, 0.18, 'square', 0.07, 0, 0.09); } },
  pickup() { this.tone(660, 0.1, 'sine', 0.14); this.tone(990, 0.18, 'sine', 0.14, 0, 0.08); },
  close() { this.tone(1100, 0.07, 'square', 0.05); },
  coin(n) { const f = 880 * Math.pow(1.0595, Math.min(n - 1, 14) * 2 % 24); this.tone(f, 0.08, 'square', 0.05); this.tone(f * 1.5, 0.12, 'square', 0.04, 0, 0.05); },
  combo(m) { this.tone(520 + m * 70, 0.12, 'triangle', 0.12); this.tone(780 + m * 90, 0.16, 'triangle', 0.1, 0, 0.08); },
  milestone() { [523, 659, 784].forEach((f, i) => this.tone(f, 0.14, 'triangle', 0.1, 0, i * 0.07)); },
  mission() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.13, 0, i * 0.09)); },
  record() { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.22, 'square', 0.07, 0, i * 0.08)); },
  levelup() { [440, 554, 659, 880, 1109].forEach((f, i) => this.tone(f, 0.2, 'triangle', 0.13, 0, i * 0.09)); },
  tick(i) { this.tone(600 + i * 70, 0.07, 'square', 0.05); },
  buy() { this.tone(1200, 0.08, 'square', 0.07); this.tone(1800, 0.2, 'square', 0.06, 0, 0.07); },
  nope() { this.tone(160, 0.14, 'sawtooth', 0.08, -30); },
  buried() { this.noise(1.2, 0.6, 400); this.tone(70, 0.9, 'sawtooth', 0.2, -40); },
};

/* ---------- input ---------- */
const keys = {}, touchKeys = {};
let hopReq = 0;               // a hop press is buffered for a moment so a quick tap between two sim steps isn't lost
function readInput() {
  return {
    left: keys.ArrowLeft || keys.KeyA || touchKeys.left,
    right: keys.ArrowRight || keys.KeyD || touchKeys.right,
    tuck: keys.ArrowUp || keys.KeyW || touchKeys.tuck,        // forward = faster
    brake: keys.ArrowDown || keys.KeyS || touchKeys.brake,    // back = slow down
    trick: keys.Space || keys.ShiftLeft || keys.ShiftRight || touchKeys.trick,
  };
}
const GAME_KEYS = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space']);
addEventListener('keydown', e => {
  if (GAME_KEYS.has(e.code) && !shopOpen) e.preventDefault();
  if (e.repeat) { keys[e.code] = true; return; }
  keys[e.code] = true;
  if ((e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') && mode === 'playing') hopReq = 0.15;
  if (e.code === 'KeyM') toggleMute();
  if (e.code === 'KeyP' || e.code === 'Escape') {
    if (shopOpen) { if (e.code === 'Escape') showCard(shopFrom, { animate: false }); }
    else if (mode === 'playing') pauseGame(); else if (mode === 'paused') resumeGame();
  }
  if ((e.code === 'Space' || e.code === 'Enter') && !shopOpen) {
    if (e.code === 'Enter' && mode !== 'playing') e.preventDefault();
    if (mode === 'title' || mode === 'over') startRun();
    else if (mode === 'paused') resumeGame();
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; for (const k in touchKeys) touchKeys[k] = false; if (mode === 'playing') pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && mode === 'playing') pauseGame(); });

const touchEl = document.getElementById('touch');
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window || /[?&]touch=1/.test(location.search);
if (isTouch) touchEl.classList.add('on');
touchEl.querySelectorAll('button').forEach(b => {
  const k = b.dataset.k;
  const set = v => e => { e.preventDefault(); touchKeys[k] = v; b.classList.toggle('down', v); };
  b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); set(true)(e); if (k === 'trick' && mode === 'playing') hopReq = 0.15; });
  b.addEventListener('pointerup', set(false));
  b.addEventListener('pointercancel', set(false));
  b.addEventListener('contextmenu', e => e.preventDefault());
});

const muteBtn = document.getElementById('muteBtn'), pauseBtn = document.getElementById('pauseBtn');
function toggleMute() {
  SFX.muted = !SFX.muted; muteBtn.textContent = SFX.muted ? '🔇' : '🔊'; if (SFX.muted) SFX.silence();
  try { localStorage.setItem('avalancheRunMuted', SFX.muted ? '1' : '0'); } catch (e) { /* ignore */ }
}
try { if (localStorage.getItem('avalancheRunMuted') === '1') { SFX.muted = true; muteBtn.textContent = '🔇'; } } catch (e) { /* ignore */ }
muteBtn.addEventListener('click', () => { toggleMute(); muteBtn.blur(); });
pauseBtn.addEventListener('click', () => { if (mode === 'playing') pauseGame(); else if (mode === 'paused') resumeGame(); pauseBtn.blur(); });

/* ---------- world state ---------- */
let mode = 'title';           // title | playing | paused | dying | over
let rng = Math.random;
let chunks = new Map();
let genY = 0, pathOff = 0, lockUntil = 0, slalom = null;
let pathPts = [];             // the guaranteed-open corridor centre, one point per generated row (used for fairness tests)
let sk, run, cam;
const particles = [], popups = [], trail = [], flakes = [];
let best = 0;
const bestKey = () => 'avalancheRunBest' + (level === 'normal' ? '' : '_' + level);
function loadBest() { try { best = +localStorage.getItem(bestKey()) || 0; } catch (e) { best = 0; } }
loadBest();
function setLevel(l) {
  if (!LEVELS[l] || l === level) return;

  }
}
function drawPopups() {
  const k = F / BACK, x = W / 2 + (sk.x - cam.x) * k, y = HOR + (HC - sk.z) * k - 64 * k;
  for (let i = 0; i < popups.length; i++) {
    const p = popups[i], a = 1 - clamp((p.age - 0.9) / 0.5, 0, 1);
    ctx.globalAlpha = a; text(p.text, x, y - p.age * 30 - (popups.length - 1 - i) * 28, p.size, p.color, 'center'); ctx.globalAlpha = 1;
  }
}
function drawVignette() {
  const sn = clamp(Math.hypot(sk.vx, sk.vy) / 700, 0, 1), d = run.danger;
  if (sn < 0.3 && d < 0.05) return;
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.35, W / 2, H / 2, Math.hypot(W, H) * 0.55);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, d > 0.05 ? `rgba(220,40,30,${(d * 0.4 * (0.7 + 0.3 * Math.sin(run.time * 10))).toFixed(3)})` : `rgba(120,170,220,${((sn - 0.3) * 0.35).toFixed(3)})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.save();
  if (run.shake > 0.3) ctx.translate((Math.random() - .5) * run.shake, (Math.random() - .5) * run.shake);
  ctx.translate(W / 2, H * 0.72); ctx.rotate(cam.roll); ctx.translate(-W / 2, -H * 0.72);      // bank into turns
  drawBackdrop(Math.max(0, sk.y) / PX_PER_M);

  const flats = [], talls = [];
  const c0 = Math.floor((cam.y - 150) / CH), c1 = Math.floor((cam.y + FAR) / CH);
  for (let ci = c0; ci <= c1; ci++) {
    const a = chunks.get(ci); if (!a) continue;
    for (const o of a) {
      const dz = o.y - cam.y, flat = o.t === 'ice' || o.t === 'mogul' || o.t === 'ramp';
      if (dz > FAR || dz < (flat ? 20 - (o.b || 0) : NEAR)) continue;
      const k = F / Math.max(dz, 40), px = W / 2 + (o.x - cam.x) * k, ext = (o.a || o.w || 70) + 50;
      if (px < -ext * k || px > W + ext * k) continue;
      (flat ? flats : talls).push(o);
    }
  }
  flats.sort((a, b) => b.y - a.y);
  for (const o of flats) o.t === 'ice' ? drawIce(o) : o.t === 'mogul' ? drawMogul(o) : drawRamp(o);
  drawTrail();

  if (!sk.buried) talls.push({ t: 'skier', y: sk.y });
  talls.sort((a, b) => b.y - a.y);                                           // far to near
  const tt = run.time || performance.now() / 1000;
  for (const o of talls) {
    if (o.t === 'skier') { drawSkier(); continue; }
    const dz = o.y - cam.y, k = F / dz, y = HOR + HC * k;
    ctx.globalAlpha = fogA(dz);
    if (o.t === 'gate') { drawGate(o, dz, k, y, tt); ctx.globalAlpha = 1; continue; }
    if (o.t === 'record') { drawRecord(o, tt); continue; }
    if (k < 0.38 && drawFar(o, W / 2 + (o.x - cam.x) * k, y, k)) continue;
    ctx.save(); ctx.translate(W / 2 + (o.x - cam.x) * k, y); ctx.scale(k, k);
    switch (o.t) {
      case 'tree': drawPine(0, 0, o.s); break;
      case 'dead': drawDead(0, 0, o.s); break;
      case 'rock': drawRock(o, 0, 0); break;
      case 'log': drawLog(o, 0, 0); break;
      case 'stump': drawStump(0, 0); break;
      case 'cocoa': if (!o.done) drawCocoa(0, 0, tt); break;
      case 'coin': if (!o.done) drawCoin(o, tt); break;
      case 'wax': if (!o.done) drawWax(0, 0, tt); break;
      case 'crosser': drawCrosser(o, 0, 0, tt); break;
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = 'rgba(255,255,255,.95)';                                    // snow spray
  for (const p of particles) {
    const dz = p.y - cam.y; if (dz < NEAR - 20) continue;
    const k = F / dz, life = 1 - p.life / p.max;
    ctx.fillStyle = p.col || 'rgba(255,255,255,.95)'; ctx.globalAlpha = clamp(life * 1.4, 0, 1);
    ctx.beginPath(); ctx.arc(W / 2 + (p.x - cam.x) * k, HOR + (HC - p.z) * k, Math.max(0.6, p.size * k * (0.5 + life * 0.5)), 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawAvalanche(tt);
  ctx.restore();
  drawFlakes();
  drawVignette();
  if (run.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.8, run.flash)})`; ctx.fillRect(0, 0, W, H); }
  if (mode !== 'title') { drawHUD(); drawPopups(); }
}

/* ---------- menus ---------- */
const overlay = document.getElementById('overlay'), card = document.getElementById('card');
let shopOpen = false, shopFrom = 'title', cardTimers = [], boughtId = null, resetArmed = false;
const later = (fn, ms) => cardTimers.push(setTimeout(fn, ms));
const cn = n => `<span class="cn"></span>${fmt(n)}`;
const KEYS_HTML = `
  <div class="keys">
    <div><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd></div><div>Steer. Straight down is fastest; sideways is slow.</div>
    <div><kbd>↑</kbd> / <kbd>W</kbd></div><div>Speed up (tuck): +30% speed, but wide, lazy turns.</div>
    <div><kbd>↓</kbd> / <kbd>S</kbd></div><div>Brake: sharper turns, much slower.</div>
    <div><kbd>Space</kbd></div><div><b>Tap</b> to hop logs, rocks and stumps (not trees!). In the air after a ramp, <b>hold</b> to spin (←/→ picks direction) and release in time to land clean.</div>
    <div><kbd>P</kbd> <kbd>M</kbd></div><div>Pause · mute.</div>
  </div>`;
const TIPS_HTML = `
  <ul class="tips">
    <li>Everything is solid. Hit a tree, rock or log and you stop dead, tumble and lose a heart. Find the open line, and keep your speed up: the <b>avalanche</b> is behind you and gains whenever you stall or crash, but a clean run pulls away and can go on forever.</li>
    <li><b>Coins</b> line the open path, float over logs (hop for them) and arc along ramp jumps. Spend them in the shop on upgrades and looks.</li>
    <li><b>Gates</b> chain a combo (centre of the gate pays double). <b>Close calls</b> past trees and rocks at speed add to it. A crash breaks it.</li>
    <li><b>Ramps</b> launch you high enough to clear rocks and logs, but never trees. Land mid-spin and you wipe out.</li>
    <li>Ice won't let you turn. Cocoa heals, wax is a speed boost.</li>
  </ul>`;
const levelPicker = () => `<div class="seg" role="group" aria-label="Difficulty">${Object.keys(LEVELS).map(k => `<button data-lv="${k}" class="${k === level ? 'on' : ''}">${LEVELS[k].label}${LEVELS[k].pay > 1 ? ' ×' + LEVELS[k].pay : ''}</button>`).join('')}</div>`;
const missionsHtml = list => list.map(m => `<div class="mission"><span>${MISSIONS[m.type].text(m.target)}</span><b>${cn(m.reward)}</b></div>`).join('');
const bestLine = () => `Best (${LV().label}): ${fmt(best)} · ${fmt(save.bestDist[level] || 0)} m${isTouch ? '' : ' · press Space'}`;
function nextGoal() {
  let g = null;
  for (const u of UPGRADES) { const l = U(u.id); if (l >= u.max) continue; const c = costOf(u, l); if (!g || c < g.cost) g = { name: `${u.name} ${['I', 'II', 'III', 'IV', 'V'][l]}`, cost: c }; }
  return g;
}
const canAfford = () => { const g = nextGoal(); return !!g && save.coins >= g.cost; };
const shopBtn = () => `<button class="secondary" id="shopBtn">SHOP${canAfford() ? '<span class="dot"></span>' : ''}</button>`;
function countUp(el, to, delayMs, durMs) {
  const t0 = performance.now() + delayMs;
  (function tick(now) {
    if (!el.isConnected) return;
    const k = clamp((now - t0) / durMs, 0, 1);
    el.textContent = fmt(to * (1 - Math.pow(1 - k, 3)));
    if (k < 1) requestAnimationFrame(tick);
  })(performance.now());
}

function titleCard() {
  const p = levelProgress(save.xp);
  return `<h1>AVALANCHE <span>RUN</span></h1><p class="tag">Outrun the mountain.</p>
    <div class="badges"><span class="badge coin">${fmt(save.coins)}</span><span class="badge">Skier Lv ${p.L}</span>${save.streak > 1 ? `<span class="badge">🔥 ${save.streak}-day streak</span>` : ''}</div>
    <div class="xp"><i style="width:${(p.frac * 100).toFixed(1)}%"></i></div>
    <div class="missions"><h3>Missions</h3>${missionsHtml(save.missions)}</div>
    ${levelPicker()}<br>
    <div class="foot"><div class="row2"><button class="primary" id="goBtn">START</button>${shopBtn()}</div></div>
    <details class="how"><summary>How to play</summary>${KEYS_HTML}${TIPS_HTML}</details>
    <div class="best">${bestLine()}</div>`;
}
function overCard(T, animate) {
  const buried = run.cause === 'buried', n = T.lines.length;
  const dly = i => animate ? `style="animation-delay:${(i * 0.32).toFixed(2)}s"` : 'style="animation:none;opacity:1"';
  const rows = T.lines.map((l, i) => `<div class="t ${l.cls}" ${dly(i)}><span>${l.label}</span><b>+${fmt(l.v)}</b></div>`).join('');
  const g = nextGoal(), ready = g && save.coins >= g.cost;
  const goal = g ? `<div class="nextgoal${ready ? ' ready' : ''}">${ready ? `<b>You can afford ${g.name}!</b> Open the shop.` : `Next upgrade: <b>${g.name}</b> · ${cn(save.coins)} / ${cn(g.cost)}`}
      <div class="bar"><i style="width:${clamp(save.coins / g.cost, 0, 1) * 100}%"></i></div></div>` : '';
  return `<h1>${buried ? 'BURIED' : 'WIPED <span>OUT</span>'}</h1>
    <p class="tag">${buried ? 'The avalanche caught you.' : 'Out of hearts.'}</p>
    ${run.newBest ? '<p class="newbest">★ NEW BEST ★</p>' : ''}
    <div class="stats">
      <div class="stat"><b>${fmt(score())}</b><small>Score</small></div>
      <div class="stat"><b>${fmt(run.dist)} m</b><small>Distance</small></div>
      <div class="stat"><b>${fmt(best)}</b><small>Best · ${LV().label}</small></div>
    </div>
    <div class="tally">${rows}<div class="t total" ${dly(n)}><span>Total earned</span><b>+<span id="totalVal">${animate ? 0 : fmt(T.total)}</span></b></div></div>
    <div class="lv">Skier Lv <b id="lvNum">${animate ? T.lvBefore : T.lvAfter}</b> <span class="lvlup" id="lvUp" style="display:none">LEVEL UP!</span></div>
    <div class="xp"><i id="xpBar" style="width:${((animate ? T.fracBefore : T.fracAfter) * 100).toFixed(1)}%"></i></div>
    ${goal}
    <div class="missions"><h3>Missions</h3>${missionsHtml(save.missions)}</div>
    ${levelPicker()}<br>
    <div class="foot"><div class="row2"><button class="primary" id="goBtn">GO AGAIN</button>${shopBtn()}</div>${isTouch ? '' : '<div class="best">press Space</div>'}</div>`;
}
function playTally(T) {
  const n = T.lines.length, step = 320;
  for (let i = 0; i <= n; i++) later(() => SFX.tick(i), 100 + i * step);
  const tv = document.getElementById('totalVal'); if (tv) countUp(tv, T.total, n * step, 900);
  const bar = document.getElementById('xpBar'), lvNum = document.getElementById('lvNum'), lvUp = document.getElementById('lvUp');
  const t = (n + 1) * step + 700, up = T.lvAfter > T.lvBefore;
  later(() => { if (bar) bar.style.width = (up ? 100 : T.fracAfter * 100) + '%'; }, t);
  if (up) later(() => {
    if (!bar) return;
    bar.style.transition = 'none'; bar.style.width = '0%'; void bar.offsetWidth; bar.style.transition = '';
    bar.style.width = (T.fracAfter * 100) + '%'; lvNum.textContent = T.lvAfter; lvUp.style.display = 'inline';
    SFX.levelup(); confetti(sk.x, sk.y, 80); run.flash = 0.5;
  }, t + 1100);
}
function shopCard() {
  const rows = UPGRADES.map(u => {
    const l = U(u.id), maxed = l >= u.max, c = maxed ? 0 : costOf(u, l);
    const pips = Array.from({ length: u.max }, (_, i) => `<i class="${i < l ? 'on' : ''}"></i>`).join('');
    return `<div class="shoprow${boughtId === u.id ? ' pop' : ''}"><div class="ic">${u.icon}</div>
      <div><div class="nm">${u.name}<span class="pips">${pips}</span></div><div class="fx">${u.fx(l)}${maxed ? '' : ` → <b>${u.fx(l + 1)}</b>`}</div></div>
      <button class="buy${maxed ? ' max' : ''}" data-up="${u.id}" ${maxed || save.coins < c ? 'disabled' : ''}>${maxed ? 'MAXED' : cn(c)}</button></div>`;
  }).join('');
  const sw = (list, owned, eq, attr, dot) => list.map(x => `<button class="sw${eq === x.id ? ' eq' : ''}${boughtId === x.id ? ' pop' : ''}" data-${attr}="${x.id}">
      <div class="dot" style="background:${dot(x)}"></div>${x.name}<small>${eq === x.id ? 'Equipped' : owned.includes(x.id) ? 'Owned' : cn(x.cost)}</small></button>`).join('');
  const jDot = j => j.shiny ? `linear-gradient(135deg,#fff3a8,${j.main} 45%,${j.dark})` : j.main;
  const tDot = t => t.rainbow ? 'conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red)' : t.col || '#dbe6f1';
  return `<div class="shop"><h1>SHOP</h1>
    <div class="badges"><span class="badge coin">${fmt(save.coins)}</span><span class="badge">Skier Lv ${levelProgress(save.xp).L}</span></div>
    <h2>Upgrades</h2>${rows}
    <h2>Jackets</h2><div class="swatches">${sw(JACKETS, save.jackets, save.jacket, 'jacket', jDot)}</div>
    <h2>Ski trails</h2><div class="swatches">${sw(TRAILS, save.trails, save.trail, 'trail', tDot)}</div>
    <button class="linkbtn" id="resetBtn">${resetArmed ? 'Tap again to erase all progress' : 'Reset progress'}</button>
    <div class="foot"><div class="row2"><button class="primary" id="backBtn">BACK</button></div></div></div>`;
}
function showCard(kind, opts = {}) {
  cardTimers.forEach(clearTimeout); cardTimers = [];
  shopOpen = kind === 'shop';
  const st = overlay.scrollTop;
  if (kind === 'title') card.innerHTML = titleCard();
  else if (kind === 'paused') card.innerHTML = `<h1>PAUSED</h1>${KEYS_HTML}<button class="primary" id="goBtn">RESUME</button>`;
  else if (kind === 'shop') card.innerHTML = shopCard();
  else { const animate = opts.animate !== false; card.innerHTML = overCard(lastTally, animate); if (animate) playTally(lastTally); }
  overlay.classList.remove('hidden');
  overlay.scrollTop = kind === 'shop' && opts.keepScroll ? st : 0;
  card.onclick = onCardClick;
}
function buy(list, key, id, attr) {
  const item = list.find(x => x.id === id); if (!item) return;
  if (save[key + 's'].includes(id)) { save[key] = id; SFX.tick(4); }                  // already owned: equip
  else if (save.coins >= item.cost) { save.coins -= item.cost; save[key + 's'].push(id); save[key] = id; SFX.buy(); }
  else { SFX.nope(); return; }
  boughtId = id; writeSave(); showCard('shop', { keepScroll: true });
}
function onCardClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  SFX.init();
  if (b.dataset.lv) {
    setLevel(b.dataset.lv);
    card.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x.dataset.lv === level));
    const bb = card.querySelector('.best'); if (bb && mode === 'title') bb.textContent = bestLine();
    b.blur(); return;
  }
  if (b.id === 'goBtn') { if (mode === 'paused') resumeGame(); else startRun(); return; }
  if (b.id === 'shopBtn') { shopFrom = mode === 'over' ? 'over' : 'title'; boughtId = null; resetArmed = false; showCard('shop'); return; }
  if (b.id === 'backBtn') { boughtId = null; showCard(shopFrom, { animate: false }); return; }
  if (b.dataset.up) {
    const u = UPGRADES.find(x => x.id === b.dataset.up), l = U(u.id), c = costOf(u, l);
    if (l >= u.max || save.coins < c) { SFX.nope(); return; }
    save.coins -= c; save.up[u.id] = l + 1; SFX.buy(); boughtId = u.id; writeSave(); showCard('shop', { keepScroll: true }); return;
  }
  if (b.dataset.jacket) { buy(JACKETS, 'jacket', b.dataset.jacket); return; }
  if (b.dataset.trail) { buy(TRAILS, 'trail', b.dataset.trail); return; }
  if (b.id === 'resetBtn') {
    if (!resetArmed) { resetArmed = true; showCard('shop', { keepScroll: true }); later(() => { resetArmed = false; if (shopOpen) showCard('shop', { keepScroll: true }); }, 3500); return; }
    resetArmed = false; save = defaultSave(); ensureMissions(); writeSave(); boughtId = null; showCard('shop', { keepScroll: true });
  }
}

/* ---------- main loop ---------- */
let last = 0, touchShown = null;
function frame(ts) {
  const dt = Math.min((ts - last) / 1000 || 0, 0.1); last = ts;
  if (mode === 'playing' || mode === 'dying') {
    const n = Math.max(1, Math.ceil(dt / (1 / 90)));
    for (let i = 0; i < n && (mode === 'playing' || mode === 'dying'); i++) step(dt / n);
  }
  if (mode !== 'paused') updateFx(dt);
  const showTouch = mode === 'playing' || mode === 'dying';
  if (showTouch !== touchShown) { touchShown = showTouch; touchEl.style.visibility = showTouch ? 'visible' : 'hidden'; pauseBtn.style.visibility = showTouch ? 'visible' : 'hidden'; }
  render();
  requestAnimationFrame(frame);
}
newRun();
showCard('title');
requestAnimationFrame(frame);
</script>
</body>
</html>
